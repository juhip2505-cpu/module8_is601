<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cute Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top left,
                    #ffe4f1,
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    #ddd4ff,
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #fff7fb,
                    #eeeaff
                );
            color: #463b55;
        }

        .calculator {
            width: 100%;
            max-width: 440px;
            padding: 38px 32px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow:
                0 24px 60px rgba(100, 78, 130, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            text-align: center;
        }

        .icon {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            border-radius: 20px;
            background: linear-gradient(
                135deg,
                #f6b9d4,
                #bfb1f3
            );
            box-shadow: 0 10px 24px rgba(170, 135, 210, 0.25);
            font-size: 30px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 32px;
            color: #4d405c;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #8e829d;
            font-size: 15px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            border: 2px solid #eee7f5;
            border-radius: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #4d405c;
            font-size: 16px;
            transition: 0.2s ease;
        }

        input::placeholder {
            color: #b2a7bd;
        }

        input:focus {
            border-color: #c9b0ed;
            box-shadow: 0 0 0 4px rgba(201, 176, 237, 0.18);
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 14px 10px;
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(110, 85, 140, 0.18);
        }

        button:active {
            transform: translateY(0);
        }

        .add-button {
            background: linear-gradient(
                135deg,
                #f3a9ca,
                #df8fba
            );
        }

        .subtract-button {
            background: linear-gradient(
                135deg,
                #baa9ef,
                #9f8bdd
            );
        }

        .multiply-button {
            background: linear-gradient(
                135deg,
                #97cbe7,
                #73b5dc
            );
        }

        .divide-button {
            background: linear-gradient(
                135deg,
                #98d9c8,
                #6fc4b0
            );
        }

        .result {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 22px;
            padding: 16px;
            border: 2px dashed #d8cae8;
            border-radius: 16px;
            background: rgba(248, 244, 252, 0.9);
            color: #6c587e;
            font-size: 18px;
            font-weight: 700;
        }

        .footer-text {
            margin-top: 20px;
            color: #a294ad;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .calculator {
                padding: 30px 22px;
            }

            .input-group,
            .button-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>
    <main class="calculator">
        <div class="icon">🧮</div>

        <h1>Calculator</h1>

        <p class="subtitle">
            Pick two numbers and let the magic happen.
        </p>

        <div class="input-group">
            <input
                type="number"
                id="a"
                placeholder="First number"
                step="any"
            >

            <input
                type="number"
                id="b"
                placeholder="Second number"
                step="any"
            >
        </div>

        <div class="button-grid">
            <button
                class="add-button"
                onclick="calculate('add')"
            >
                ＋ Add
            </button>

            <button
                class="subtract-button"
                onclick="calculate('subtract')"
            >
                − Subtract
            </button>

            <button
                class="multiply-button"
                onclick="calculate('multiply')"
            >
                × Multiply
            </button>

            <button
                class="divide-button"
                onclick="calculate('divide')"
            >
                ÷ Divide
            </button>
        </div>

        <div class="result" id="result">
            Your result will appear here
        </div>

        <p class="footer-text">
            Made with FastAPI and unnecessary cuteness ♡
        </p>
    </main>

    <script>
        async function calculate(operation) {
            const aInput = document.getElementById("a");
            const bInput = document.getElementById("b");
            const resultElement = document.getElementById("result");

            if (
                aInput.value.trim() === ""
                || bInput.value.trim() === ""
            ) {
                resultElement.innerText =
                    "Please enter both numbers ♡";
                return;
            }

            const a = parseFloat(aInput.value);
            const b = parseFloat(bInput.value);

            resultElement.innerText = "Calculating... ";

            try {
                const response = await fetch(
                    "/" + operation,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            a: a,
                            b: b
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    resultElement.innerText =
                        "Result: " + data.result;
                } else {
                    resultElement.innerText =
                        "Error: "
                        + (data.error || "Something went wrong");
                }
            } catch (error) {
                resultElement.innerText =
                    "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
